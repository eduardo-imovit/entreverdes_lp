  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Cores da Marca */
      --creme: #F5F0E8;
      --champagne: #EDE7D9;
      --pergaminho: #FAF6EF;
      --grafite: #2D2D2D;
      --grafite-mid: #444444;
      --grafite-soft: #888888;
      --branco: #FFFFFF;
      --coral: #E8593C;
      --coral-light: #F5C4B3;
      --coral-soft: #FDE8E0;
      --coral-dark: #B93A18;

      /* Tipografia */
      --font-serif: 'Noto Serif Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--pergaminho);
      color: var(--grafite);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
      padding: 24px;
    }

    /* Fundo Orgânico Premium */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 10% 20%, rgba(232, 89, 60, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(45, 65, 35, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      text-align: center;
    }

    /* ── Logo ────────────────────────────────────────────── */
    .logo-container {
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeInDown 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: inline-block;
    }

    /* ── Card Principal ───────────────────────────────────── */
    .thank-you-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(237, 231, 217, 0.6);
      border-radius: 12px;
      padding: 56px 40px;
      box-shadow: 0 24px 64px rgba(45, 45, 45, 0.05), 0 4px 16px rgba(45, 45, 45, 0.02);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    @media (max-width: 480px) {
      .thank-you-card {
        padding: 40px 24px;
      }
    }

    /* Animação do Check */
    .success-icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon-bg {
      position: absolute;
      inset: 0;
      background: var(--coral-soft);
      border-radius: 50%;
      transform: scale(0);
      animation: scaleUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
    }

    .success-icon {
      position: relative;
      z-index: 1;
      width: 44px;
      height: 44px;
      color: var(--coral);
      opacity: 0;
      transform: scale(0.6);
      animation: scaleUpIcon 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards;
    }

    /* Tipografia */
    .headline {
      font-family: var(--font-serif);
      font-size: clamp(32px, 5vw, 42px);
      font-weight: 400;
      color: var(--grafite);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }

    .headline em {
      font-style: italic;
      color: var(--coral);
    }

    .description {
      font-family: var(--font-sans);
      font-size: clamp(14px, 1.6vw, 16px);
      font-weight: 300;
      color: var(--grafite-mid);
      line-height: 1.7;
      max-width: 440px;
      margin: 0 auto 40px;
    }

    /* Botões / Saídas */
    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px 28px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--coral);
      color: var(--branco);
      border: 1px solid var(--coral);
      box-shadow: 0 4px 16px rgba(232, 89, 60, 0.15);
    }

    .btn-primary:hover {
      background: var(--coral-light);
      border-color: var(--coral-light);
      color: var(--grafite);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232, 89, 60, 0.25);
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s;
    }

    .btn-primary:hover svg {
      transform: scale(1.1);
    }

    .btn-secondary {
      background: transparent;
      color: var(--grafite-mid);
      border: 1px solid var(--grafite-soft);
    }

    .btn-secondary:hover {
      background: rgba(45, 45, 45, 0.04);
      color: var(--grafite);
      border-color: var(--grafite);
      transform: translateY(-1px);
    }

    .btn-secondary svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    .btn-secondary:hover svg {
      transform: translateX(-4px);
    }

    /* Rodapé da Página */
    .footer-note {
      margin-top: 48px;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grafite-soft);
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }

    /* ── Keyframes Animações ──────────────────────────────── */
    @keyframes fadeInDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      to {
        transform: scale(1);
      }
    }

    @keyframes scaleUpIcon {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
